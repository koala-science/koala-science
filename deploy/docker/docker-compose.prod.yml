services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${COALESCENCE_REGISTRY}/backend:${COALESCENCE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT:-5432}/coalescence_v1
      - POSTGRES_DB=coalescence_v1
      - REDIS_URL=redis://redis:6379/0
      - GCS_STORAGE_BUCKET=koalascience-storage-v1
    volumes:
      - storage_data_v1:/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.advance-paper-status.schedule: "0 */30 * * * *"
      ofelia.job-exec.advance-paper-status.command: "python -m scripts.advance_paper_status --not-before 2026-04-24T16:00:00Z"
      ofelia.job-exec.advance-paper-status.no-overlap: "true"
      # release-papers cron disabled — uncomment to re-enable
      # ofelia.job-exec.release-papers.schedule: "0 0 */2 * * *"
      # ofelia.job-exec.release-papers.command: "python -m scripts.release_papers --initial-batch 300 --target-under-reviewed 200 --review-threshold 7 --not-before 2026-04-24T16:00:00Z"
      # ofelia.job-exec.release-papers.no-overlap: "true"

  temporal-worker:
    image: ${COALESCENCE_REGISTRY}/backend:${COALESCENCE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.temporal_worker"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT:-5432}/coalescence_v1
      - POSTGRES_DB=coalescence_v1
      - REDIS_URL=redis://redis:6379/0
      - GCS_STORAGE_BUCKET=koalascience-storage-v1
    depends_on:
      redis:
        condition: service_healthy

  mcp:
    image: ${COALESCENCE_REGISTRY}/mcp:${COALESCENCE_TAG:-latest}
    restart: unless-stopped
    environment:
      - COALESCENCE_API_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${COALESCENCE_REGISTRY}/frontend:${COALESCENCE_TAG:-latest}
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  backend-v0:
    image: ${COALESCENCE_REGISTRY}/backend@sha256:74da0300cbf7eb1e87f0760231f8416f1254bce1735de33f370775f526baedaf
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT:-5432}/coalescence
      - POSTGRES_DB=coalescence
      - REDIS_URL=redis://redis:6379/1
      - GCS_STORAGE_BUCKET=koalascience-storage
      - SIGNUPS_ENABLED=false
      - TEMPORAL_HOST=archive-has-no-worker.invalid:7233
    volumes:
      - storage_data:/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend-v0:
    image: ${COALESCENCE_REGISTRY}/frontend@sha256:ecd18fc124a0287f139f7804db93dc0c9255513e43bfd053079d6bd6c9f6efe4
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://backend-v0:8000/api/v1
    depends_on:
      - backend-v0

  ofelia:
    image: mcuadros/ofelia@sha256:0aeec97f549d3cae77cd5a926001d5beeac3aa91e69363f9db1e85851c091328
    restart: unless-stopped
    command: daemon --docker
    environment:
      - TZ=UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - mcp
      - backend-v0
      - frontend-v0
    environment:
      - DOMAIN=${DOMAIN}
      - TEMPORAL_UI_ADDRESS=${TEMPORAL_UI_ADDRESS}
      - TEMPORAL_ADMIN_USER=${TEMPORAL_ADMIN_USER:-admin}
      - TEMPORAL_ADMIN_HASH=${TEMPORAL_ADMIN_HASH}

volumes:
  redis_data:
  storage_data_v1:
  caddy_data:
  caddy_config:
  storage_data:
