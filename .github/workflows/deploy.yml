name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.GCP_REGISTRY }}
  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            build-args: ""
          - name: frontend
            context: ./frontend
            build-args: ""
          - name: mcp
            context: ./agent-skills/mcp-server
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.name }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.name }}:cache,mode=max
          build-args: ${{ matrix.build-args }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare env snippet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          : "${GEMINI_API_KEY:?the GEMINI_API_KEY secret is empty; the check pipeline would deploy dead}"
          : "${ANTHROPIC_API_KEY:?the ANTHROPIC_API_KEY secret is empty; verification-worker would deploy dead}"
          : "${OPENREVIEW_USERNAME:?the OPENREVIEW_USERNAME secret is empty; signup would answer 503}"
          : "${OPENREVIEW_PASSWORD:?the OPENREVIEW_PASSWORD secret is empty; signup would answer 503}"
          # Non-blocking, and it removes itself once the secret exists: signup
          # completes without this but every later login answers 401, so the
          # breakage stays visible on each deploy rather than only in a comment.
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY is empty; signup completes but every login answers 401. Human signup is broken until this secret exists."
          fi
          # compose-go reads the VM's .env, expanding $VAR in unquoted values and
          # stripping inline '#'. A mangled password logs in as a wrong one, which
          # surfaces as the same 503 these guards exist to prevent.
          case "$OPENREVIEW_PASSWORD" in
            *'$'*|*'#'*|*[[:space:]]*)
              echo "OPENREVIEW_PASSWORD contains a character the .env parser mangles (\$, # or whitespace); rotate it" >&2
              exit 1 ;;
          esac
          printf 'GEMINI_API_KEY=%s\nHF_TOKEN=%s\nANTHROPIC_API_KEY=%s\nOPENREVIEW_USERNAME=%s\nOPENREVIEW_PASSWORD=%s\nRESEND_API_KEY=%s\n' \
            "$GEMINI_API_KEY" "$HF_TOKEN" "$ANTHROPIC_API_KEY" "$OPENREVIEW_USERNAME" "$OPENREVIEW_PASSWORD" "$RESEND_API_KEY" > /tmp/env.snippet
          wc -l /tmp/env.snippet

      - name: Deploy to VM
        run: |
          gcloud compute scp deploy/docker/docker-compose.prod.yml deploy/docker/Caddyfile /tmp/env.snippet \
            coalescence-app:/tmp/ \
            --zone=${{ secrets.GCP_APP_VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --strict-host-key-checking=no

          gcloud compute ssh coalescence-app \
            --zone=${{ secrets.GCP_APP_VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command="
              sudo cp /tmp/docker-compose.prod.yml /tmp/Caddyfile /opt/coalescence/ && \
              cd /opt/coalescence && \
              sudo sed -i -E '/^[[:space:]]*(GEMINI_API_KEY|HF_TOKEN|ANTHROPIC_API_KEY|OPENREVIEW_USERNAME|OPENREVIEW_PASSWORD|RESEND_API_KEY)[[:space:]]*=/d; /^[[:space:]]*EOF[[:space:]]*$/d' .env && \
              sudo sh -c 'cat /tmp/env.snippet >> /opt/coalescence/.env' && \
              sudo rm /tmp/env.snippet && \
              sudo docker compose -f docker-compose.prod.yml pull && \

              # Rolling update: bring up services one at a time, wait for healthy
              # Backend first (runs migrations on start)
              sudo docker compose -f docker-compose.prod.yml up -d --no-deps --wait backend && \

              # Then services that depend on backend
              sudo docker compose -f docker-compose.prod.yml up -d --no-deps --wait temporal-worker && \
              sudo docker compose -f docker-compose.prod.yml up -d --no-deps --wait mcp && \
              sudo docker compose -f docker-compose.prod.yml up -d --no-deps --wait frontend && \

              # Reload Caddy config (no restart needed)
              sudo docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null || \
              sudo docker compose -f docker-compose.prod.yml restart caddy && \

              # Cleanup
              sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
              sudo docker image prune -f
            "
